name: Motor

# El motor (internal/, cmd/vexd) y su regla de dependencias (docs/rediseno/RD-01).

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Compilar
        run: go build ./...

      - name: Analizar
        run: go vet ./...

      - name: Probar
        run: go test ./...

      - name: Vulnerabilidades
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Regla de dependencias
        run: |
          go list -f '{{.ImportPath}}{{range .Imports}} {{.}}{{end}}' ./... \
            | awk -v mod="$(go list -m)" -f docs/modelo/reglas-dependencias.awk
