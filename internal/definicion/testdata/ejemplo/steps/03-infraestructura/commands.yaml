- name: iniciar
  cmd: terraform init -backend-config="key=${var.project_id}/${var.environment}/main.tfstate"
  workdir: ./terraform

- name: planificar
  cmd: terraform plan -var-file="terraform.tfvars" -out plan.out
  workdir: ./terraform
  templates:
    - terraform.tfvars

- name: aplicar
  cmd: terraform apply plan.out
  workdir: ./terraform
  outputs:
    - name: cluster_nombre
      probe: cluster_nombre\s*=\s*"([^"]+)"
    - name: cluster_fqdn
      probe: cluster_fqdn\s*=\s*"([^"]+)"
