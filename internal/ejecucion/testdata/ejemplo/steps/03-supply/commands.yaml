- name: comando-supply-01
  description: usa la variable producida por el paso anterior y la variable estándar del ambiente
  workdir: terraform
  cmd: cat terraform.tfvars
  templates:
    - terraform.tfvars

- name: comando-supply-02
  description: produce la variable que consume el siguiente paso
  cmd: echo azure_resource_group_name=gruporecursovar
  outputs:
    - name: azure_resource_group_name
      description: nombre de grupo de recurso
      probe: 'azure_resource_group_name=(\S+)'
