- name: comando-test-01
  description: imprime la plantilla ya interpolada, para comprobar que la parte del motor se rehizo de verdad
  cmd: cat plantilla.txt
  templates:
    - plantilla.txt

- name: comando-test-02
  description: produce la variable que consume el siguiente paso
  cmd: echo etiqueta=v1.0.0
  outputs:
    - name: etiqueta
      description: la etiqueta que se despliega
      probe: 'etiqueta=(\S+)'

- name: comando-test-03
  description: usa la variable configurada
  cmd: echo var ${var.test}

- name: comando-test-04
  description: usa la variable compartida
  cmd: echo var shared ${var.shared}

- name: comando-test-05
  description: usa la variable compartida
  cmd: cat ${var.project_workdir}/README.md

