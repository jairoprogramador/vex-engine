# El step declara a qué ámbito pertenece (spec 13) y bajo qué reglas vuelve a
# ejecutarse (spec 15). Sin `config.yaml` el step se ejecutaría siempre y no
# persistiría registro; sin `rules`, también.
scope: environment

# La forma corta, que equivale a `[pipeline, project]`: este step vigila su
# propia declaración Y el código del proyecto. Es lo que hacía el motor para
# todos los steps antes de la spec 15, menos el TTL global de 30 días.
rules:
  - state_changed
