# El `tee -a "$VEX_TEST_LOG"` no es decorativo: `$VAR` no lo interpola el motor
# (solo `${var....}`), llega intacto al shell. El harness usa ese archivo para
# distinguir "el step se ejecutó" de "el step se saltó".
- name: build
  description: compila el proyecto y publica el nombre del artefacto
  cmd: echo "01-test BUILD SUCCESS artifact=demo-app" | tee -a "$VEX_TEST_LOG"
  outputs:
    - probe: BUILD SUCCESS
    - name: artifact_name
      description: nombre del artefacto construido, consumido por 02-supply
      probe: artifact=([a-z0-9-]+)
